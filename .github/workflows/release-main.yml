name: Build and release main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: release-main
          repository-cache: true

      - name: Test
        run: bazel test //:tests

      - name: Build deployable JAR
        run: bazel build //:cool-raspberries_deploy.jar

      - name: Prepare release files
        id: release
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="main-${GITHUB_SHA}"
          asset="cool-raspberries-${short_sha}.jar"
          mkdir -p dist
          cp bazel-bin/cool-raspberries_deploy.jar "dist/${asset}"
          sha256sum "dist/${asset}" > "dist/${asset}.sha256"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
          ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "dist/${ASSET}" "dist/${ASSET}.sha256" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "dist/${ASSET}" "dist/${ASSET}.sha256" \
              --target "${GITHUB_SHA}" \
              --title "Main build ${SHORT_SHA}" \
              --notes "Automated build of main at commit ${GITHUB_SHA}."
          fi
