name: Build and release main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: release-main
          repository-cache: true

      - name: Test
        run: bazel test //:tests

      - name: Build release archive
        run: bazel build //:release-archive

      - name: Prepare release files
        id: release
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="main-${GITHUB_SHA}"
          jar_asset="cool-raspberries-${short_sha}.jar"
          archive_asset="cool-raspberries-${short_sha}.tar.gz"
          mkdir -p dist
          cp bazel-bin/cool-raspberries_deploy.jar "dist/${jar_asset}"
          cp bazel-bin/cool-raspberries.tar.gz "dist/${archive_asset}"
          (
            cd dist
            sha256sum "${jar_asset}" "${archive_asset}" > SHA256SUMS
          )
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "jar_asset=${jar_asset}" >> "${GITHUB_OUTPUT}"
          echo "archive_asset=${archive_asset}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
          JAR_ASSET: ${{ steps.release.outputs.jar_asset }}
          ARCHIVE_ASSET: ${{ steps.release.outputs.archive_asset }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "dist/${JAR_ASSET}" "dist/${ARCHIVE_ASSET}" \
              dist/SHA256SUMS --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "dist/${JAR_ASSET}" "dist/${ARCHIVE_ASSET}" \
              dist/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "Main build ${SHORT_SHA}" \
              --notes "Automated build of main at commit ${GITHUB_SHA}."
          fi
